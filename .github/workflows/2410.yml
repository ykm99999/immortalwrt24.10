# .github/workflows/build-n60pro.yml
name: Build Netcore N60 Pro 2G (Kernel Dependencies Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils
      - name: Update feeds (default only, no extra)
        run: |
          cd immortalwrt24.10
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Copy custom config
        run: |
          cd immortalwrt24.10
          cp ../config/n60por.config .config
      - name: Run defconfig
        run: |
          cd immortalwrt24.10
          make defconfig
      - name: Download dependencies
        run: |
          cd immortalwrt24.10
          make download -j$(nproc) V=s
      - name: Build firmware
        run: |
          cd immortalwrt24.10
          make -j$(nproc) V=s
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cd immortalwrt24.10
          find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/ \;
      - name: Create Release and upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deps-${{ github.run_number }}
          name: "N60 Pro 2G 纯净依赖固件 build-${{ github.run_number }}"
          body: |
            ## 仅包含内核依赖（Docker + 科学上网 所需模块）
            - 固件体积小，刷机后请通过 `opkg` 安装应用：
              ```bash
              opkg update
              opkg install docker-ce dockerd luci-app-dockerman docker-compose
              opkg install luci-app-passwall2
              ```
            - 已启用性能调优：CPU 性能模式、全锥形 NAT、BBR、硬件 HNAT
            - 后台：192.168.6.1  root / password
          files: artifacts/*
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
