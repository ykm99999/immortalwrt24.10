# .github/workflows/build-n60pro.yml
name: Build Netcore N60 Pro 2G

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '清理构建（重新下载依赖）'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ---------------------------------------------
      # 1. 准备环境
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show directory structure
        run: |
          echo "=== 当前目录结构 ==="
          ls -la

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils libelf-dev autotools-dev \
            autoconf automake autopoint libtool pkg-config ccache uuid-dev \
            libz-dev

      # ---------------------------------------------
      # 2. 克隆你的 ImmortalWrt 源码
      # ---------------------------------------------
      - name: Clone your ImmortalWrt source
        run: |
          REPO_URL="https://github.com/ykm99999/immortalwrt24.10.git"
          
          if [ -d "immortalwrt24.10" ]; then
            echo "源码目录已存在，更新..."
            cd immortalwrt24.10
            git remote set-url origin "$REPO_URL"
            git pull origin main
            git checkout main
          else
            echo "从你的仓库克隆源码..."
            git clone --depth=1 --branch main "$REPO_URL" immortalwrt24.10
          fi
          
          cd immortalwrt24.10
          echo "=== 当前源码信息 ==="
          git log -1 --oneline
          git remote -v

      # ---------------------------------------------
      # 3. 缓存配置
      # ---------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        if: inputs.clean_build != true
        with:
          path: |
            ~/.ccache
            immortalwrt24.10/staging_dir
          key: n60pro-ccache-${{ github.run_id }}
          restore-keys: |
            n60pro-ccache-

      - name: Cache downloads
        uses: actions/cache@v4
        if: inputs.clean_build != true
        with:
          path: immortalwrt24.10/dl
          key: n60pro-dl-${{ hashFiles('immortalwrt24.10/.config') }}
          restore-keys: |
            n60pro-dl-

      # ---------------------------------------------
      # 4. 更新 feeds
      # ---------------------------------------------
      - name: Update feeds
        run: |
          cd immortalwrt24.10
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------
      # 5. 应用配置
      # ---------------------------------------------
      - name: Copy custom config
        run: |
          cd immortalwrt24.10
          cp ../config/n60por.config .config
          echo "✅ 配置文件已应用"

      - name: Run defconfig
        run: |
          cd immortalwrt24.10
          make defconfig

      # ---------------------------------------------
      # 6. 下载依赖
      # ---------------------------------------------
      - name: Download dependencies
        run: |
          cd immortalwrt24.10
          make download -j$(nproc)
        continue-on-error: true
        timeout-minutes: 60

      # ---------------------------------------------
      # 7. 编译固件
      # ---------------------------------------------
      - name: Build firmware
        run: |
          cd immortalwrt24.10
          make -j$(nproc) V=s CCACHE=1 2>&1 | tee build.log
          
          # 检查是否成功
          if ls bin/targets/mediatek/filogic/*/openwrt-*-netcore_n60-pro*.itb 2>/dev/null; then
            echo "✅ 固件编译成功"
          else
            echo "⚠️ 检查日志中的错误..."
            tail -50 build.log
            exit 1
          fi
        timeout-minutes: 480

      # ---------------------------------------------
      # 8. 收集产物
      # ---------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cd immortalwrt24.10
          
          echo "=== 固件文件 ==="
          find bin/targets -type f \( -name "*.itb" -o -name "*.bin" \) -exec ls -lh {} \;
          
          # 复制固件
          find bin/targets -type f \( -name "*sysupgrade.itb" -o -name "*sysupgrade.bin" -o -name "*factory.bin" \) \
            -exec cp -v {} ../artifacts/ \; 2>/dev/null || true
          
          echo ""
          echo "=== 产物列表 ==="
          ls -lh ../artifacts/

      # ---------------------------------------------
      # 9. 上传 Release
      # ---------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "N60 Pro 2G 固件 #$(github.run_number)"
          body: |
            ## 📦 N60 Pro 2G 纯净固件

            **Build ID**: ${{ github.run_id }}
            **源码**: ykm99999/immortalwrt24.10

            ---

            ### ✅ 已包含内核依赖

            - Docker 容器支持 (cgroup, veth 等)
            - 科学上网支持 (tun, nft-tproxy)
            - 无线驱动 (mt7915e)
            - 硬件加速 (HNAT, offload)

            ---

            ### 🚀 刷机后安装应用

            ```bash
            opkg update
            opkg install docker-ce dockerd luci-app-dockerman
            opkg install luci-app-passwall2
