name: Build N60 Pro 精简高性能固件 (内置 SSR Plus+)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      # ========== 关键：添加 SSR Plus+ 的 feeds 源 ==========
      - name: Update feeds (with SSR Plus+)
        run: |
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ========== 直接使用根目录下的 config 文件 ==========
      - name: Copy custom config
        run: |
          cp config/n60por.config .config

      - name: Run defconfig
        run: make defconfig

      - name: Download dependencies
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find bin/targets/ -name "*sysupgrade.itb" -exec cp {} artifacts/ \;
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} artifacts/ \;
          find bin/targets/ -name "*factory.bin" -exec cp {} artifacts/ \;

      - name: Create Release and upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "N60 Pro 精简高性能固件 build-${{ github.run_number }}"
          body: |
            ## 精简高性能固件 (内置 SSR Plus+)

            - **源码**：基于 padavanonly/immortalwrt-mt798x-24.10
            - **内核**：CPU 性能模式 + 全锥形 NAT + BBR + 硬件 HNAT
            - **科学上网**：内置 luci-app-ssr-plus + xray-core（开箱即用）
            - **设计理念**：精简、稳定、高性能
            - **后台**：192.168.6.1  root / password

            ### 刷写说明
            - 通过 U-Boot 刷入 `sysupgrade.itb` 文件
            - 首次启动建议不保留配置
          files: artifacts/*
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
