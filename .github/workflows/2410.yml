# .github/workflows/build-n60pro.yml
name: Build Netcore N60 Pro 2G

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '清理构建（重新下载依赖）'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ---------------------------------------------
      # 1. 准备环境
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show directory structure
        run: |
          echo "=== 当前工作目录 ==="
          pwd
          echo ""
          echo "=== 当前目录结构 ==="
          ls -la
          echo ""
          echo "=== 检查 immortalwrt24.10 子目录 ==="
          if [ -d "immortalwrt24.10" ]; then
            ls -la immortalwrt24.10/
            echo "✅ 源码目录存在"
          else
            echo "❌ immortalwrt24.10 目录不存在"
          fi

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils libelf-dev autotools-dev \
            autoconf automake autopoint libtool pkg-config ccache uuid-dev libz-dev

      # ---------------------------------------------
      # 2. 设置源码目录路径
      # ---------------------------------------------
      - name: Setup source directory
        id: setup_source
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # 检查 immortalwrt24.10 子目录是否存在
          if [ -d "immortalwrt24.10" ]; then
            echo "dir=immortalwrt24.10" >> $GITHUB_OUTPUT
            echo "🔍 使用子目录: immortalwrt24.10"
          else
            echo "dir=." >> $GITHUB_OUTPUT
            echo "🔍 使用当前目录作为源码目录"
          fi
          
          echo "最终源码路径: ${{ steps.setup_source.outputs.dir }}"

      # ---------------------------------------------
      # 3. 更新源码（从你的仓库拉取）
      # ---------------------------------------------
      - name: Pull latest source
        run: |
          cd "$GITHUB_WORKSPACE/immortalwrt24.10"
          
          echo "=== 当前源码状态 ==="
          git remote -v
          git log -1 --oneline
          echo ""
          
          echo "=== 拉取最新代码 ==="
          git remote set-url origin https://github.com/ykm99999/immortalwrt24.10.git
          git pull origin main --force
          
          echo ""
          echo "✅ 源码已更新"
          git log -1 --oneline

      # ---------------------------------------------
      # 4. 缓存配置
      # ---------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        if: inputs.clean_build != true
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/immortalwrt24.10/staging_dir
          key: n60pro-ccache-${{ github.run_id }}
          restore-keys: |
            n60pro-ccache-

      - name: Cache downloads
        uses: actions/cache@v4
        if: inputs.clean_build != true
        with:
          path: ${{ github.workspace }}/immortalwrt24.10/dl
          key: n60pro-dl-${{ hashFiles('${{ github.workspace }}/immortalwrt24.10/.config') }}
          restore-keys: |
            n60pro-dl-

      # ---------------------------------------------
      # 5. 更新 feeds
      # ---------------------------------------------
      - name: Update feeds
        run: |
          cd ${{ github.workspace }}/immortalwrt24.10
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------
      # 6. 应用配置
      # ---------------------------------------------
      - name: Copy custom config
        run: |
          cd ${{ github.workspace }}/immortalwrt24.10
          
          # 查找配置文件
          CONFIG_FILE="${{ github.workspace }}/config/n60por.config"
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" .config
            echo "✅ 配置文件已应用"
          else
            echo "❌ 配置文件不存在: $CONFIG_FILE"
            ls -la ${{ github.workspace }}/config/
            exit 1
          fi

      - name: Run defconfig
        run: |
          cd ${{ github.workspace }}/immortalwrt24.10
          make defconfig

      # ---------------------------------------------
      # 7. 下载依赖
      # ---------------------------------------------
      - name: Download dependencies
        run: |
          cd ${{ github.workspace }}/immortalwrt24.10
          make download -j$(nproc)
        continue-on-error: true
        timeout-minutes: 60

      # ---------------------------------------------
      # 8. 编译固件
      # ---------------------------------------------
      - name: Build firmware
        run: |
          cd ${{ github.workspace }}/immortalwrt24.10
          make -j$(nproc) V=s CCACHE=1 2>&1 | tee build.log
          
          # 检查是否成功
          if ls bin/targets/mediatek/filogic/*/openwrt-*-netcore_n60-pro*.itb 2>/dev/null; then
            echo "✅ 固件编译成功"
          else
            echo "⚠️ 检查日志中的错误..."
            tail -50 build.log
            exit 1
          fi
        timeout-minutes: 480

      # ---------------------------------------------
      # 9. 收集产物
      # ---------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          cd ${{ github.workspace }}/immortalwrt24.10
          
          echo "=== 固件文件 ==="
          find bin/targets -type f \( -name "*.itb" -o -name "*.bin" \) -exec ls -lh {} \;
          
          # 复制固件
          find bin/targets -type f \( -name "*sysupgrade.itb" -o -name "*sysupgrade.bin" -o -name "*factory.bin" \) \
            -exec cp -v {} ${{ github.workspace }}/artifacts/ \; 2>/dev/null || true
          
          echo ""
          echo "=== 产物列表 ==="
          ls -lh ${{ github.workspace }}/artifacts/

      # ---------------------------------------------
      # 10. 上传 Release
      # ---------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "N60 Pro 2G 固件 #${{ github.run_number }}"
          body: |
            ## 📦 N60 Pro 2G 纯净固件

            **Build ID**: ${{ github.run_id }}
            **源码**: ykm99999/immortalwrt24.10

            ---

            ### ✅ 已包含
            - Docker 容器支持
            - 科学上网支持
            - 无线驱动 (mt7915e)
            - 硬件加速 (HNAT)

            ---

            ### 📝 默认信息
            | 项目 | 值 |
            |------|-----|
            | 管理地址 | 192.168.6.1 |
            | 用户名 | root |
            | 密码 | password |

          files: ${{ github.workspace }}/artifacts/*
