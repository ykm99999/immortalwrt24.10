name: Build U-Boot + ImmortalWrt Firmware

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    # ========================
    # 1. 编译 U-Boot
    # ========================
    - name: Checkout U-Boot source (hanwckf/bl-mt798x)
      uses: actions/checkout@v4
      with:
        repository: hanwckf/bl-mt798x
        ref: master
        path: bl-mt798x

    - name: Install U-Boot build dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler

    - name: Build U-Boot for N60 Pro
      run: |
        cd bl-mt798x
        chmod +x ./build.sh
        SOC=mt7986 BOARD=netcore_n60pro ./build.sh

    - name: Collect U-Boot artifacts
      run: |
        mkdir -p artifacts/uboot
        find bl-mt798x/output -name "bl2.img" -exec cp {} artifacts/uboot/ \;
        find bl-mt798x/output -name "fip.bin" -exec cp {} artifacts/uboot/ \;
        # 可选：u-boot.bin 也可能存在
        find bl-mt798x/output -name "u-boot.bin" -exec cp {} artifacts/uboot/ \; || true

    # ========================
    # 2. 编译 ImmortalWrt 固件
    # ========================
    - name: Prepare environment (OpenWrt)
      run: |
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget qemu-utils

    - name: Update feeds
      run: |
        cd immortalwrt24.10
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom config and enable kernel support
      run: |
        cd immortalwrt24.10
        cp ../config/n60por.config .config
        # 追加 Docker/科学上网所需内核选项（如果配置中未包含）
        echo "CONFIG_KERNEL_CGROUPS=y" >> .config
        echo "CONFIG_KERNEL_NAMESPACES=y" >> .config
        echo "CONFIG_KERNEL_VETH=y" >> .config
        echo "CONFIG_KERNEL_BRIDGE=y" >> .config
        echo "CONFIG_KERNEL_OVERLAY_FS=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        # 禁用闭源无线驱动（避免冲突）
        sed -i 's/^CONFIG_PACKAGE_kmod-mt_wifi=y/# CONFIG_PACKAGE_kmod-mt_wifi=y/g' .config

    - name: Run defconfig
      run: |
        cd immortalwrt24.10
        make defconfig

    - name: Download dependencies
      run: |
        cd immortalwrt24.10
        make download -j$(nproc) V=s

    - name: Build firmware
      run: |
        cd immortalwrt24.10
        make -j$(nproc) V=s

    - name: Collect firmware artifacts
      run: |
        mkdir -p artifacts/firmware
        cd immortalwrt24.10
        find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/firmware/ \;
        find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/firmware/ \;
        find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/firmware/ \;

    # ========================
    # 3. 创建 Release 并上传
    # ========================
    - name: Prepare artifacts summary
      run: |
        ls -laR artifacts/
        echo "Artifacts list" > artifacts/README.txt
        echo "uboot/ contains bl2.img and fip.bin for Netcore N60 Pro (built from hanwckf/bl-mt798x)" >> artifacts/README.txt
        echo "firmware/ contains sysupgrade.itb (ImmortalWrt image)" >> artifacts/README.txt

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: "N60 Pro 2G 全家桶 build-${{ github.run_number }}"
        body: |
          ## 自动构建产物 (U-Boot + 固件)

          - **U-Boot**：基于 [hanwckf/bl-mt798x](https://github.com/hanwckf/bl-mt798x) 编译，支持 512MB/2GB 通用
            - `uboot/bl2.img` + `uboot/fip.bin` 配对使用
          - **ImmortalWrt 固件**：
            - 精简版，内置 LuCI + Argon 主题
            - 内核已开启 Docker、科学上网所需模块（应用包请刷机后通过 `opkg` 安装）
            - 固件位置：`firmware/`

          刷机前请备份原厂固件，风险自负。
        files: artifacts/*
        allow_updates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
