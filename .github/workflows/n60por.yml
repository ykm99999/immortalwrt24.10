name: Build Netcore N60 Pro (2GB) with PassWall2

on:
  workflow_dispatch:

env:
  SOURCE_DIR: immortalwrt24.10
  CONFIG_FILE: config/n60por.config

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget qemu-utils

    - name: Configure feeds with PassWall
      run: |
        cd ${{ env.SOURCE_DIR }}
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default
        echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom config
      run: |
        cd ${{ env.SOURCE_DIR }}
        cp ../${{ env.CONFIG_FILE }} .config

    - name: Run defconfig
      run: |
        cd ${{ env.SOURCE_DIR }}
        make defconfig

    - name: Download dependencies
      run: |
        cd ${{ env.SOURCE_DIR }}
        make download -j$(nproc) V=s

    - name: Build firmware
      run: |
        cd ${{ env.SOURCE_DIR }}
        make -j$(nproc) V=s

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cd ${{ env.SOURCE_DIR }}
        find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "*.fip" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "preloader.bin" -exec cp {} ../artifacts/ \;
        cd ..
        ls -la artifacts/ > artifacts/filelist.txt

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: Netcore N60 Pro Firmware with PassWall2 ${{ github.run_number }}
        body: |
          ## 自动编译固件（含 PassWall2）
          - 设备：Netcore N60 Pro (2GB 内存版)
          - 科学上网：集成 PassWall2（含 ss-rust、xray-core）
          - 编译时间：${{ github.event.head_commit.timestamp }}
          - 提交哈希：${{ github.sha }}
          - 触发方式：手动
        files: artifacts/*
        allow_updates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
