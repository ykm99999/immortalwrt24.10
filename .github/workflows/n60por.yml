# .github/workflows/build-n60pro.yml
name: Build Netcore N60 Pro 2G Performance Edition

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Add extra feeds (passwall2, openclash)
        run: |
          cd immortalwrt24.10
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git" >> feeds.conf.default
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy custom config
        run: |
          cd immortalwrt24.10
          cp ../config/n60por.config .config

      - name: Run defconfig
        run: |
          cd immortalwrt24.10
          make defconfig

      - name: Download dependencies
        run: |
          cd immortalwrt24.10
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd immortalwrt24.10
          make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cd immortalwrt24.10
          find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/ \;

      - name: Create Release and upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: performance-${{ github.run_number }}
          name: "N60 Pro 2G 性能榨干版 build-${{ github.run_number }}"
          body: |
            ## 自动编译极限性能固件

            - 设备：Netcore N60 Pro 官方2G版
            - 内核：性能模式 + 全锥形NAT + BBR + 硬件HNAT
            - 集成：Docker (dockerd + dockerman) + PassWall2 + OpenClash + AdGuardHome
            - 存储：USB 3.0 + UAS + ext4/f2fs/ntfs3
            - 编译：已禁用 mklibs，避免 `libc.so` 错误

            ### 刷写说明
            - 若已有 **UBI 布局 U-Boot**，可直接刷入 `sysupgrade.itb`
            - 从原厂/其他固件升级，建议通过 U-Boot 恢复界面刷入 `factory.bin`
            - 后台：`192.168.6.1` 用户：`root` 密码：`password`
          files: artifacts/*
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
