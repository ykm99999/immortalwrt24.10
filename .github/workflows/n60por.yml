name: Build ImmortalWrt Firmware for Netcore N60 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Update feeds
        run: |
          cd immortalwrt24.10
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy custom config
        run: |
          cd immortalwrt24.10
          cp ../config/n60por.config .config

      - name: Run defconfig
        run: |
          cd immortalwrt24.10
          make defconfig

      - name: Download dependencies
        run: |
          cd immortalwrt24.10
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd immortalwrt24.10
          make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cd immortalwrt24.10
          find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/ \;
          find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: firmware-${{ github.run_number }}
          name: "N60 Pro ImmortalWrt 固件 build-${{ github.run_number }}"
          body: |
            ## 自动编译固件（内核级 Docker + 科学上网 支持）

            - 设备：Netcore N60 Pro (2G 官方版)
            - 固件类型：精简版（不含 Docker/科学上网 应用包，内核模块完整）
            - 刷机后通过 `opkg install` 安装所需应用（docker-ce, luci-app-passwall2 等）
            - 后台地址：192.168.6.1  用户：root  密码：password

            ### 刷写方式
            - **首次刷机**：通过 U-Boot Web 界面 (`192.168.1.1`) 刷入 `factory.bin`
            - **升级**：在现有 OpenWrt 中执行 `sysupgrade -n /tmp/xxx-sysupgrade.itb`
          files: artifacts/*
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
