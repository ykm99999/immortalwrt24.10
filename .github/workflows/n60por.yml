name: Build Netcore N60 Pro (2G) Lite

on:
  workflow_dispatch:

env:
  SOURCE_DIR: immortalwrt24.10
  CONFIG_FILE: config/n60por.config

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget qemu-utils

    - name: Update feeds (default only, no extra)
      run: |
        cd ${{ env.SOURCE_DIR }}
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom config and enable kernel support
      run: |
        cd ${{ env.SOURCE_DIR }}
        cp ../${{ env.CONFIG_FILE }} .config

        # 启用 Docker 所需的内核模块
        echo "CONFIG_KERNEL_CGROUPS=y" >> .config
        echo "CONFIG_KERNEL_NAMESPACES=y" >> .config
        echo "CONFIG_KERNEL_VETH=y" >> .config
        echo "CONFIG_KERNEL_BRIDGE=y" >> .config
        echo "CONFIG_KERNEL_OVERLAY_FS=y" >> .config

        # 启用 TUN 模块（科学上网常用）
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

        # 确保冲突包被禁用（如果配置文件中有）
        sed -i 's/^CONFIG_PACKAGE_kmod-mt_wifi=y/# CONFIG_PACKAGE_kmod-mt_wifi=y/g' .config

    - name: Run defconfig
      run: |
        cd ${{ env.SOURCE_DIR }}
        make defconfig

    - name: Download dependencies
      run: |
        cd ${{ env.SOURCE_DIR }}
        make download -j$(nproc) V=s

    - name: Build firmware
      run: |
        cd ${{ env.SOURCE_DIR }}
        make -j$(nproc) V=s

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cd ${{ env.SOURCE_DIR }}
        find bin/targets/ -name "*sysupgrade.itb" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "*sysupgrade.bin" -exec cp {} ../artifacts/ \;
        find bin/targets/ -name "*factory.bin" -exec cp {} ../artifacts/ \;
        cd ..
        ls -la artifacts/ > artifacts/filelist.txt

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: N60 Pro 2G Lite ${{ github.run_number }}
        body: |
          ## 精简版固件（内核支持 Docker + 科学上网）
          - 设备：磊科 N60 Pro 官方 2G 版
          - 固件体积：大幅减小，只保留内核模块
          - 刷机后可通过 `opkg install` 在线安装 Docker 和 PassWall2
          - 已启用内核选项：cgroups, namespaces, veth, bridge, overlayfs, tun
        files: artifacts/*
        allow_updates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
