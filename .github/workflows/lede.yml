# .github/workflows/build-lede-n60pro.yml
name: Build LEDE Rescue Firmware for Netcore N60 PRO

on:
  workflow_dispatch:

env:
  LEDE_DIR: lede
  CONFIG_PATH: config/lede.config

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository (self)
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Install compilation dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git \
            libssl-dev gettext zlib1g-dev swig unzip time rsync \
            python3 python3-dev python3-pip subversion file libelf-dev \
            ecj fastjar java-propose-classpath

      - name: Clone hanwckf/bl-mt798x repository
        run: git clone --depth 1 https://github.com/hanwckf/bl-mt798x.git hanwckf-bluetooth

      - name: Setup LEDE source with custom ATF/UBoot and strace patch
        run: |
          # 复制 LEDE 源码
          cp -r repo/${{ env.LEDE_DIR }} openwrt
          cd openwrt

          # 1. 替换 ATF 源码 (hanwckf 仓库中的 atf-20240117-bacca82a8 子目录)
          ATF_PKG_DIR="package/boot/arm-trusted-firmware-mediatek"
          rm -rf $ATF_PKG_DIR/src
          cp -r ../hanwckf-bluetooth/atf-20240117-bacca82a8 $ATF_PKG_DIR/src
          # 修改 PKG_VERSION 避免版本哈希检查（可选）
          sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=20240117-bacca82a8/' $ATF_PKG_DIR/Makefile

          # 2. 替换 U-Boot 源码 (uboot-mtk-20230718-09eda825 子目录)
          UBOOT_PKG_DIR="package/boot/uboot-mediatek"
          rm -rf $UBOOT_PKG_DIR/src
          cp -r ../hanwckf-bluetooth/uboot-mtk-20230718-09eda825 $UBOOT_PKG_DIR/src
          sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=20230718-09eda825/' $UBOOT_PKG_DIR/Makefile

          # 3. 使用你的配置文件
          cp ../repo/${{ env.CONFIG_PATH }} .config

          # 4. 确保 strace 补丁已存在（不需要额外操作，LEDE 会自动应用）
          # 补丁文件应位于 package/devel/strace/patches/100-fix-ptp-ioctl-size.patch

      - name: Update feeds and install packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        run: |
          cd openwrt
          make defconfig

      - name: Clean previous build (optional, avoids cache issues)
        run: |
          cd openwrt
          make clean 2>/dev/null || true

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Prepare artifacts
        run: |
          cd openwrt
          mkdir -p artifacts
          # 固件
          find bin/targets/ -name "*-sysupgrade.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find bin/targets/ -name "*-initramfs-kernel.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find bin/targets/ -name "*-factory.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          # U-Boot 产物
          find build_dir/target-*/uboot-*/u-boot.bin -exec cp {} artifacts/u-boot.bin \; 2>/dev/null || true
          find build_dir/target-*/uboot-*/mtk-*fip.bin -exec cp {} artifacts/ \; 2>/dev/null || true
          # 配置文件
          cp .config artifacts/config.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lede-n60pro-rescue
          path: openwrt/artifacts/
          retention-days: 5
