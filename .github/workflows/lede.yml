# .github/workflows/build-lede-upgrade.yml
name: Build LEDE Upgrade Firmware for N60 Pro (2GB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout your repository (main branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compilation dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git \
            libssl-dev gettext zlib1g-dev swig unzip time rsync \
            python3 python3-dev python3-pip subversion file libelf-dev \
            ecj fastjar java-propose-classpath

      - name: Setup LEDE source from your repo's lede/ directory
        run: |
          cp -r lede openwrt
          cd openwrt
          cp ../config/lede.config .config

      - name: Update feeds and install packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        run: |
          cd openwrt
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware (sysupgrade + initramfs)
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Prepare artifacts
        run: |
          cd openwrt
          mkdir -p artifacts
          find bin/targets/ -name "*-sysupgrade.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find bin/targets/ -name "*-initramfs-kernel.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp .config artifacts/config.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lede-n60pro-upgrade-2gb
          path: openwrt/artifacts/
          retention-days: 5
