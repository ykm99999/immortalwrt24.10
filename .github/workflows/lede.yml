# .github/workflows/build-lede-n60pro.yml
name: Build Custom LEDE Firmware for N60 Pro

on:
  workflow_dispatch:       # 支持手动触发编译
  # push:                   # 可选，取消注释即可在每次推送时自动编译
  #   branches: [ main ]

env:
  LEDE_DIR: lede                   # LEDE 源码存放目录
  CONFIG_PATH: config/lede.config  # 固件配置文件路径

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository (self)
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      # ================== 环境准备 ==================
      - name: Install compilation dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git \
            libssl-dev gettext zlib1g-dev swig unzip time rsync \
            python3 python3-dev python3-pip subversion file libelf-dev \
            ecj fastjar java-propose-classpath

      # ================== 克隆自定义ATF和U-Boot源码 ==================
      - name: Clone custom ATF source
        run: git clone --depth 1 --branch master https://github.com/hanwckf/bl-mt798x.git atf-source
        # 注：根据实际需求调整分支名，原链接可能需精确到子目录，此步会下载完整仓库

      - name: Clone custom U-Boot source
        run: git clone --depth 1 --branch master https://github.com/hanwckf/bl-mt798x.git uboot-source

      # ================== 设置LEDE源码并替换ATF/U-Boot ==================
      - name: Setup LEDE source
        run: |
          # 复制LEDE源码
          cp -r repo/${{ env.LEDE_DIR }} openwrt
          cd openwrt
          
          # 替换 ATF 源码 (根据实际目录结构调整)
          rm -rf atf 2>/dev/null || true
          cp -r ../atf-source atf
          
          # 替换 U-Boot 源码 (如有独立目录类似处理)
          rm -rf uboot 2>/dev/null || true
          cp -r ../uboot-source uboot
          
          # 使用指定的配置文件
          cp ../repo/${{ env.CONFIG_PATH }} .config

      - name: Update feeds and install packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        run: |
          cd openwrt
          make defconfig

      # ================== 编译固件 ==================
      - name: Build firmware (LEDE)
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) V=s || make -j1 V=s  # 若并行失败则回退到单核编译

      # ================== 收集编译产出 ==================
      - name: Prepare artifacts
        run: |
          cd openwrt
          mkdir -p artifacts
          # 查找并复制 sysupgrade 和 factory 镜像
          find bin/targets/ -name "*-sysupgrade.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find bin/targets/ -name "*-factory.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          find bin/targets/ -name "*-initramfs-kernel.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          # 复制 U-Boot (如有)
          find uboot/ -name "*.bin" -exec cp {} artifacts/ \; 2>/dev/null || true
          # 复制编译日志（可选）
          cp .config artifacts/config.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledger-n60pro-firmware
          path: openwrt/artifacts/
          retention-days: 5
