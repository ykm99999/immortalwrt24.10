name: Sync ImmortalWrt 25.12 Source

on:
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: '0 0 * * 0'     # 每周日零点自动同步（可选）

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout your repository (target branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove existing immortalwrt25.12 directory if any
        run: rm -rf immortalwrt25.12

      - name: Clone ImmortalWrt 25.12 source (official)
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt25.12

      - name: Remove .git from cloned source (avoid submodule issues)
        run: rm -rf immortalwrt25.12/.git

      - name: Commit and push to your main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add immortalwrt25.12
          git commit -m "chore: sync ImmortalWrt 25.12 source from official repo" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
